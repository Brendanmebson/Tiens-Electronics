<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart — Tiens Electronics</title>
<meta name="description" content="Your shopping cart at Tiens Electronics.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tiens Electronics">
<meta property="og:title" content="Cart — Tiens Electronics">
<meta property="og:description" content="Your shopping cart at Tiens Electronics.">
<meta name="theme-color" content="#1d5fb8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body data-page="cart">
<div id="site-header"></div>
<main>

<div class="container" style="padding-top:44px"><h1 class="h2" style="margin-top:0">Your cart</h1>
<div class="empty" id="cartempty" style="margin-top:32px" hidden><p style="font-size:18px">Your cart is empty.</p><a class="btn btn-y" href="/shop" style="margin-top:18px">Continue shopping</a></div>
<div class="cart-wrap" id="cartfull" hidden>
<div><div id="cartlines"></div><div class="row" style="margin-top:20px;justify-content:space-between"><a href="/shop" style="font-weight:600;color:#1d5fb8">← Continue shopping</a><button class="rm" id="clear" style="margin:0">Clear cart</button></div></div>
<aside class="sum"><h3>Order summary</h3><div class="r"><span>Subtotal</span><b id="sub" style="color:#111"></b></div><div class="r"><span>Delivery</span><span>Confirmed at checkout</span></div>
<div class="tot"><span>Total</span><span id="tot"></span></div><a class="btn btn-y" href="/checkout">Proceed to Checkout</a></aside></div></div>
</main>
<div id="site-footer"></div>
<script src="/app.js"></script>
</body>
</html>
